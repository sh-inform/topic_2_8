<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>КіберЛаб 8: продуктивність і безпека</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: лабораторія-квест для 8 класу — бадьоро, чітко, з викликом
   IDEA: «КіберЛаб»: кожна тема — відсік лабораторії з власним кольором; проходиш, збираєш бали, отримуєш допуск
   PICTURE: фіолетова плата з чипом-щитом і потоками бітів; у розділах — живі тренажери (плата, інбокс, брандмауер, шкала подій)
   COLOUR and TYPE: фіолетовий підручника #5b3df5, помаранчевий акцент, кольори відсіків; Unbounded + Manrope + JetBrains Mono
   LAYOUT: верхня смуга прогресу, бічна карта розділів, один розділ на екран, кнопки «назад/далі» */
:root{color-scheme:light dark;
--bg:light-dark(#f5f3ff,#13112a);--paper:light-dark(#ffffff,#1d1a3a);--paper2:light-dark(#f0edff,#262150);
--ink:light-dark(#1b1640,#efecff);--mute:light-dark(#575178,#b2abda);--line:light-dark(#dcd6fb,#37306a);
--vio:#5b3df5;--vio-ink:light-dark(#4527e0,#b3a5ff);--soft:light-dark(#ebe6ff,#2c2660);
--org:#ff7a1a;--org-ink:light-dark(#b84d00,#ffb27a);
--ok:light-dark(#0f7a55,#5fe0aa);--okbg:light-dark(#e3f7ee,#173a2d);--bad:light-dark(#c0233b,#ff8b9c);--badbg:light-dark(#fde8ec,#3e1a24);
--r:16px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Manrope,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:clamp(26px,3.6vw,40px)}h3{font-size:19px;font-weight:600}
p{margin:.4em 0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font:800 16px Manrope,system-ui,sans-serif;min-height:46px;padding:10px 20px;border-radius:24px;border:2px solid var(--vio);background:var(--paper);color:var(--vio-ink);cursor:pointer;transition:transform .15s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);background:var(--soft)}
.btn.pri{background:var(--vio);color:#fff}.btn.pri:hover:not(:disabled){background:#4a2be6}
.btn.org{background:var(--org);border-color:var(--org);color:#1b1640}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:var(--line);color:var(--ink)}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px max(3vw,14px)}
.brand{display:flex;align-items:center;gap:10px;font:800 17px Unbounded,sans-serif;color:var(--ink);text-decoration:none;flex:none}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--vio);display:grid;place-items:center}
.brand svg{width:20px;height:20px;stroke:#fff}
.tp{flex:1;display:flex;flex-direction:column;gap:4px;max-width:520px;margin-left:auto}
.tp-row{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--mute);gap:10px}
.tp-row b{color:var(--ink)}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vio),var(--org));border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.score-pill{flex:none;font-weight:800;background:var(--soft);color:var(--vio-ink);padding:6px 12px;border-radius:20px;font-size:15px;white-space:nowrap}
@media(max-width:640px){.brand span{display:none}.score-pill{display:none}}

/* shell */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1400px;margin:0 auto}
.side{position:sticky;top:64px;align-self:start;height:calc(100vh - 64px);overflow:auto;padding:18px 12px 30px;border-right:1px solid var(--line)}
.side ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.side a{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 10px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;line-height:1.25}
.side a:hover{background:var(--soft)}
.side a[aria-current=page]{background:var(--vio);color:#fff}
.side .st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:13px;font-weight:800}
.side a.part .st{border-color:var(--org);color:var(--org-ink);background:color-mix(in srgb,var(--org) 14%,transparent)}
.side a.full .st{background:var(--ok);border-color:var(--ok);color:#fff}
.side a[aria-current=page] .st{border-color:#fff;color:#fff}
.side small{font-size:12px;font-weight:800;color:var(--mute);white-space:nowrap}
.side a[aria-current=page] small{color:#e5e0ff}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:sticky;top:61px;z-index:40;height:auto;border-right:0;border-bottom:1px solid var(--line);background:var(--paper);padding:8px}.side ol{display:flex;overflow-x:auto;gap:6px;scrollbar-width:thin}.side li{flex:none}.side a{grid-template-columns:26px auto;padding:6px 10px}.side .st{width:26px;height:26px}.side small,.side .nm{display:none}.side a[aria-current=page] .nm{display:inline}}

main{padding:0 0 60px}
.view{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.view:focus{outline:none}

/* hero / start */
.hero{background:var(--vio);color:#fff;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(16px,3vw,40px);align-items:center;padding:clamp(28px,4vw,56px) max(4vw,16px);position:relative;overflow:hidden}
.hero h1{font-size:clamp(30px,4.6vw,54px);line-height:1.04}
.hero p{color:#e7e2ff;font-size:18px;max-width:36em}
.tag{display:inline-block;background:var(--org);color:#1b1640;font-weight:800;padding:4px 12px;border-radius:14px;margin-bottom:14px;font-size:14px}
.hero svg{width:100%;height:auto;display:block}
.bits text{font:700 13px JetBrains Mono,monospace;fill:#cfc5ff;opacity:.55;animation:rain 6s linear infinite}
@keyframes rain{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{transform:scale(1.06)}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero svg{max-width:420px;margin:0 auto}}
.startform{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.startform input{font:700 17px Manrope,sans-serif;min-height:48px;padding:10px 14px;border-radius:14px;border:2px solid #ffffff80;background:#ffffff1f;color:#fff;width:min(100%,280px)}
.startform input::placeholder{color:#e1dbff}
.wrap{padding:clamp(22px,3vw,40px) max(4vw,16px)}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:6px 0 22px}
@media(max-width:800px){.rules{grid-template-columns:1fr}}
.rule{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.rule b{display:block;font-family:Unbounded,sans-serif;font-size:16px;margin-bottom:4px}
.rule p{color:var(--mute);font-size:15px;margin:0}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:flex;gap:12px;align-items:center;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;min-height:84px;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--ac)}
.tile i{flex:none;width:48px;height:48px;border-radius:14px;background:var(--ac);display:grid;place-items:center}
.tile svg{width:26px;height:26px;stroke:#fff}
.tile span{font-weight:800;font-size:15px;line-height:1.25}
.tile small{display:block;color:var(--mute);font-weight:700;font-size:13px}

/* section header */
.shead{background:var(--ac);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:clamp(22px,3vw,40px) max(4vw,16px)}
.snum{font:800 14px Manrope;background:#ffffff26;display:inline-block;padding:3px 12px;border-radius:12px;margin-bottom:10px}
.shead p{color:#fff;opacity:.92;max-width:44em;font-size:17px}
.sicon{width:clamp(80px,11vw,130px);aspect-ratio:1;border-radius:28px;background:#ffffff1f;display:grid;place-items:center;border:2px solid #ffffff40}
.sicon svg{width:58%;height:58%;stroke:#fff;stroke-width:1.6}
.sprog{display:flex;align-items:center;gap:12px;margin-top:14px;max-width:520px}
.sprog .bar{flex:1;background:#ffffff33}.sprog .bar span{background:#fff}
.sprog span.sp-txt{font-weight:800;font-size:14px;white-space:nowrap}
@media(max-width:560px){.shead{grid-template-columns:1fr}.sicon{display:none}}

.tasks{display:grid;gap:22px;padding:clamp(20px,3vw,34px) max(4vw,16px)}
.task{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,2.4vw,26px);box-shadow:0 3px 0 var(--line)}
.th{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px}
.tkind{display:inline-block;font-size:12px;font-weight:800;color:var(--org-ink);background:color-mix(in srgb,var(--org) 15%,transparent);border-radius:8px;padding:1px 8px;margin-bottom:6px}
.pts{flex:none;font-weight:800;font-size:14px;background:var(--soft);color:var(--vio-ink);padding:5px 11px;border-radius:14px;white-space:nowrap}
.pts.done{background:var(--okbg);color:var(--ok)}
.lead{color:var(--mute);margin:0 0 14px;max-width:62em}
.lead b{color:var(--ink)}
.note{font-size:14px;color:var(--mute)}
.pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 max(4vw,16px)}
.secsum{margin:0 max(4vw,16px) 18px;padding:14px 18px;border-radius:var(--r);background:var(--paper2);font-weight:800;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}

/* feedback */
.good,.bad{border-radius:12px;padding:10px 14px;margin-top:10px}
.good{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}
.good b,.bad b{font-weight:800}
.fb ul{margin:6px 0 0;padding-left:20px;color:var(--ink)}
.act{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.hint{font-size:14px;color:var(--mute)}
.donep{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--okbg);color:var(--ok);padding:14px 16px;border-radius:14px;font-weight:800}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.06)}}

/* quiz */
.q{padding:14px 0;border-top:1px dashed var(--line)}.q:first-child{border-top:0;padding-top:0}
.qq{font-weight:700;margin:0 0 10px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(max-width:620px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;min-height:48px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700;font-size:16px;transition:border-color .15s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--vio);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.ex{font-size:15px}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fc{all:unset;cursor:pointer;perspective:900px;height:200px;display:block;border-radius:16px}
.fc:focus-visible{outline:3px solid var(--org);outline-offset:3px}
.fi{position:relative;display:block;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fc.flipped .fi{transform:rotateY(180deg)}
.ff,.fbk{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:16px;display:flex;flex-direction:column;justify-content:center}
.ff{background:var(--ac,var(--vio));color:#fff;font:600 17px/1.25 Unbounded,sans-serif;text-align:center;align-items:center}
.ff small{font:700 12px Manrope;opacity:.8;margin-top:10px}
.fbk{background:var(--paper2);color:var(--ink);transform:rotateY(180deg);font-size:14.5px;line-height:1.45;overflow:auto;justify-content:flex-start;border:2px solid var(--ac,var(--vio))}

/* sort */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:12px;border:2px dashed var(--line);border-radius:14px;margin-bottom:12px}
.pool:empty::after{content:"Усі картки розподілено — натисни «Перевірити»";color:var(--mute);font-size:14px;font-weight:700;align-self:center}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.bucket{border:2px solid var(--line);border-radius:14px;background:var(--paper2);display:flex;flex-direction:column;min-height:120px;transition:border-color .15s,background .15s}
.bucket.over,.pool.over{border-color:var(--vio);background:var(--soft)}
.bh{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 12px;font-weight:800;font-size:15px;border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.bh small{font-weight:700;color:var(--mute);font-size:12px}
.bh:focus-visible{outline:3px solid var(--org)}
.bin{display:flex;flex-wrap:wrap;gap:6px;padding:10px;flex:1;align-content:flex-start}
.chip{min-height:44px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:grab;font-weight:700;font-size:15px;text-align:left;transition:transform .15s,box-shadow .15s}
.chip:hover{transform:translateY(-2px)}
.chip.sel{border-color:var(--org);box-shadow:0 0 0 3px color-mix(in srgb,var(--org) 35%,transparent)}
.chip.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.chip.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.chip.right::after{content:" ✓"}.chip.wrong::after{content:" ✗"}
/* motherboard puzzle */
.board .buckets{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"cpu ram ram" "pcie pcie m2" "sata atx atx";background:#2a1f63;padding:16px;border-radius:18px;gap:12px;background-image:linear-gradient(90deg,#ffffff10 1px,transparent 1px),linear-gradient(#ffffff10 1px,transparent 1px);background-size:22px 22px;position:relative}
.board .bucket{background:#1c1446;border:2px dashed #c9a646;color:#f3eaff;min-height:96px}
.board .bh{border-bottom-color:#c9a64660;color:#ffe08a}.board .bh small{color:#cfc4ff}
.board .bucket.over{background:#3a2c86}
@media(max-width:620px){.board .buckets{grid-template-columns:1fr;grid-template-areas:"cpu" "ram" "pcie" "m2" "sata" "atx"}}

/* order */
.ord{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:o}
.oi{display:grid;grid-template-columns:auto 30px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--paper2);border:2px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px;counter-increment:o}
.oi::before{content:counter(o);font:800 14px Unbounded;color:var(--vio-ink)}
.grip{color:var(--mute);cursor:grab;letter-spacing:-2px;text-align:center}
.ot{font-weight:700}
.ob{display:flex;gap:4px}
.mv{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-weight:800}
.mv:disabled{opacity:.3}
.oi.right{border-color:var(--ok);background:var(--okbg)}.oi.wrong{border-color:var(--bad);background:var(--badbg)}
.oi.drag{opacity:.4}

/* match */
.match{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:10px 14px}
@media(max-width:620px){.match{grid-template-columns:1fr}}
.mcol{display:grid;gap:8px;align-content:start}
.mi{text-align:left;min-height:48px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700;font-size:15px}
.mi.l{font-family:Unbounded,sans-serif;font-weight:600}
.mi.sel{border-color:var(--org);box-shadow:0 0 0 3px color-mix(in srgb,var(--org) 35%,transparent)}
.mi.right{border-color:var(--ok);background:var(--okbg);color:var(--ok);cursor:default}

/* lab widgets */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--paper2);border-radius:14px;padding:14px;border:1px solid var(--line)}
.panel h4{margin:0 0 8px;font:600 16px Unbounded,sans-serif}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ctrl button,.seg button{min-height:40px;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-weight:800}
.ctrl button[aria-pressed=true]{background:var(--vio);border-color:var(--vio);color:#fff}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.field input,.inp{font:700 17px Manrope,sans-serif;min-height:46px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);flex:1;min-width:160px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace!important}
/* magnifier */
.mag{position:relative;overflow:hidden;height:112px;border-radius:12px;background:#fff;color:#222;border:1px solid var(--line);cursor:none;touch-action:none}
.mag.full{overflow:auto;cursor:auto;touch-action:auto}
.mag.inv{filter:invert(1) hue-rotate(180deg)}
.tiny{font:5.5px/1.5 Arial,sans-serif;padding:10px;width:100%;transform-origin:0 0}
.lens{position:absolute;width:150px;height:150px;border-radius:50%;border:3px solid var(--org);overflow:hidden;pointer-events:none;box-shadow:0 6px 20px #0005;background:#fff;display:none}
.lens .tiny{position:absolute;left:0;top:0}
/* on-screen keyboard */
.osk{display:grid;gap:5px;margin-top:10px;user-select:none}
.osk .row{display:flex;gap:4px;justify-content:center}
.key{flex:1 1 0;min-width:0;max-width:46px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:800;font-size:15px;box-shadow:0 2px 0 var(--line)}
.key:active{transform:translateY(2px);box-shadow:none}
.key.w{max-width:none;flex:2 1 0}.key.sp{max-width:none;flex:6 1 0}
.key[aria-pressed=true]{background:var(--vio);color:#fff}
/* defrag */
.disk{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px;margin:10px 0}
.disk i{aspect-ratio:1;border-radius:3px;background:var(--line);transition:background .25s}
.disk .a{background:#5b3df5}.disk .b{background:#ff7a1a}.disk .c{background:#0fa3a0}.disk .d{background:#e0457b}
/* timeline */
.tl{position:relative;margin:16px 4px 6px;padding-top:6px}
.tl-track{position:relative;height:8px;border-radius:4px;background:var(--soft);margin:30px 14px 0}
.tl-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--vio),var(--org));border-radius:4px;transition:width .4s}
.tl-nodes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:-26px}
.tl-node{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;font-weight:800;color:var(--mute);padding-bottom:4px}
.tl-node i{width:30px;height:30px;border-radius:50%;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;transition:transform .25s,background .25s}
.tl-node.full i{border-color:var(--vio)}.tl-node.diff i{border-color:#0fa3a0}.tl-node.fail i{border-color:var(--bad)}.tl-node.change i{border-color:var(--org)}

.tm table{width:100%;border-collapse:collapse;font-size:15px}
.tm th,.tm td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.tm th{font-size:13px;color:var(--mute)}
.tm td.r{text-align:right;white-space:nowrap}
.imp{font-weight:800;font-size:13px;padding:2px 8px;border-radius:8px;white-space:nowrap}

.tog{min-width:104px;min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-weight:800;font-size:14px}

.boot{margin:14px 0 4px}
.boot .bar{height:18px;border-radius:9px;position:relative;overflow:visible}

.inbox{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}

.mlist{border-right:1px solid var(--line);display:flex;flex-direction:column}

.scale{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;font-size:14px}

}

 const TXT='Операційна система керує ресурсами комп’ютера: процесором, оперативною пам’яттю, дисками та пристроями введення й виведення. Вона запускає програми, дозволяє працювати з файлами та папками і захищає дані від несанкціонованого доступу. Інструменти доступності допомагають кожному користувачеві. <b>Секретне слово: ПРОЦЕСОР</b>. Екранна лупа збільшує частину екрана, екранний диктор озвучує текст, а екранна клавіатура дає змогу вводити символи без фізичної клавіатури. Регулярно оновлюйте систему, щоб закривати вразливості.';
 el.innerHTML=`<div class="grid2">
 <div class="panel"><h4>1. Екранна лупа</h4><p class="note">Наведи лупу на дрібний текст (на телефоні — веди пальцем). Режим «Повноекранний» і кнопки ± діють як Win + «+» / Win + «−».</p>
  <div class="ctrl" role="group" aria-label="Режим лупи"><button type="button" data-m="lens" aria-pressed="true">Лінза</button><button type="button" data-m="full" aria-pressed="false">Повноекранний</button><button type="button" data-z="-1" aria-label="Зменшити масштаб">−</button><button type="button" data-z="1" aria-label="Збільшити масштаб">+</button><button type="button" data-inv aria-pressed="false">Інвертувати кольори</button></div>
  <div class="mag" aria-label="Дрібний текст для перевірки лупи"><div class="tiny">${TXT}</div><div class="lens"><div class="tiny">${TXT}</div></div></div>
  <p class="note">Масштаб: <b class="zv">3×</b></p>
  <div class="field"><label for="${b.id}-sw" class="sr">Секретне слово</label><input class="inp" id="${b.id}-sw" placeholder="Секретне слово" autocomplete="off"><button class="btn pri" type="button" data-sw>Перевірити</button></div><div class="fb fm" aria-live="polite"></div></div>
 <div class="panel"><h4>2. Екранна клавіатура</h4><p class="note">Фізична клавіатура тут «зламана». Набери слово <b>Безпека</b> (з великої літери — скористайся Shift) і натисни Enter.</p>

 </div>

 /* magnifier */
 const mag=$('.mag',el),lens=$('.lens',el),base=$('.mag>.tiny',el),lt=$('.lens .tiny',el);let z=3,mode='lens';
 const sizeLens=()=>{lt.style.width=base.offsetWidth+'px';lt.style.transform=`scale(${z})`};
 const move=(x,y)=>{const R=75;lens.style.display='block';lens.style.left=(x-R)+'px';lens.style.top=(y-R)+'px';lt.style.left=(-x*z+R)+'px';lt.style.top=(-y*z+R)+'px'};
 const pos=e=>{const r=mag.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 mag.addEventListener('pointermove',e=>{if(mode!=='lens')return;sizeLens();move(...pos(e))});
 mag.addEventListener('pointerdown',e=>{if(mode!=='lens')return;sizeLens();move(...pos(e))});
 mag.addEventListener('pointerleave',()=>{lens.style.display='none'});
 const apply=()=>{$('.zv',el).textContent=z+'×';if(mode==='full'){base.style.transform=`scale(${z})`;base.style.width=(100/z)+'%'}else{base.style.transform='';base.style.width='100%';sizeLens()}};
 el.addEventListener('click',e=>{const m=e.target.closest('[data-m]');if(m){mode=m.dataset.m;$$('[data-m]',el).forEach(x=>x.setAttribute('aria-pressed',x===m));mag.classList.toggle('full',mode==='full');lens.style.display='none';apply();return}

  const iv=e.target.closest('[data-inv]');if(iv){const on=iv.getAttribute('aria-pressed')!=='true';iv.setAttribute('aria-pressed',on);mag.classList.toggle('inv',on);return}});
 const tryEnd=()=>{if(doneMag&&doneKey&&!pr)award(b.id,pMag+pKey,false);if(doneMag&&doneKey&&pr)award(b.id,pMag+pKey,true)};

  if(v==='ПРОЦЕСОР'){if(!doneMag){pMag=2;doneMag=true;tryEnd()}fm.innerHTML='<div class="good"><b>Знайдено!</b> Без лупи такий текст прочитати майже неможливо — так почуваються люди з вадами зору.</div>'}
  else fm.innerHTML='<div class="bad">Не те слово. Пошукай уважніше — збільш масштаб кнопкою «+».</div>'};
 if(!pr)setBadge(b.id,`0 / 4 б.`);
 /* OSK */
 const R=[['й','ц','у','к','е','н','г','ш','щ','з','х','ї'],['ф','і','в','а','п','р','о','л','д','ж','є'],['SHIFT','я','ч','с','м','и','т','ь','б','ю','⌫'],['SPACE','ENTER']];
 const osk=$('.osk',el),out=$('.osk',el).previousElementSibling;let shift=false;
 const drawK=()=>{osk.innerHTML=R.map(r=>`<div class="row">${r.map(k=>k==='SHIFT'?`<button type="button" class="key w" data-k="SHIFT" aria-pressed="${shift}">⇧ Shift</button>`:k==='⌫'?'<button type="button" class="key w" data-k="BS" aria-label="Видалити символ">⌫</button>':k==='SPACE'?'<button type="button" class="key sp" data-k=" ">Пробіл</button>':k==='ENTER'?'<button type="button" class="key w" data-k="EN">Enter ↵</button>':`<button type="button" class="key" data-k="${k}">${shift?k.toUpperCase():k}</button>`).join('')}</div>`).join('')};
 drawK();
 osk.addEventListener('click',e=>{const k=e.target.closest('.key');if(!k)return;const v=k.dataset.k;
  if(v==='SHIFT'){shift=!shift;drawK();osk.querySelector('[data-k="SHIFT"]').focus();return}
  if(v==='BS'){out.value=out.value.slice(0,-1);return}
  if(v==='EN'){const fk=$('.fk',el);if(out.value==='Безпека'){if(!doneKey){pKey=2;doneKey=true;tryEnd()}fk.innerHTML='<div class="good"><b>Чудово!</b> Ти ввів слово без фізичної клавіатури і скористався спеціальною клавішею Shift.</div>'}else fk.innerHTML=`<div class="bad">Введено «${esc(out.value)}». Потрібно рівно «Безпека» — перша літера велика.</div>`;return}
  out.value+=shift?v.toUpperCase():v;if(shift){shift=false;const f=document.activeElement===k;drawK();if(f)osk.querySelector(`[data-k="${v}"]`)?.focus()}});
 /* TTS */
 const note=$('.tts',el);
 $('[data-say]',el).onclick=()=>{if(!('speechSynthesis' in window)){note.textContent='Цей браузер не підтримує озвучення. У Windows диктор вмикається комбінацією Ctrl + Win + Enter.';return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($(`#${b.id}-tts`,el).value);u.lang='uk-UA';u.rate=+$(`#${b.id}-rate`,el).value;const vs=speechSynthesis.getVoices().filter(v=>/^uk/i.test(v.lang));if(vs[0])u.voice=vs[0];else note.textContent='Українського голосу в браузері не знайдено — диктор читатиме голосом за замовчуванням.';speechSynthesis.speak(u)};

 <div class="boot"><p>Час завантаження: <span class="boot-t">—</span> <span class="note">(мета — не більше ${GOAL} с, зелена риска)</span></p><div class="bar"><span></span><i class="goal" style="left:${GOAL/30*100}%"></i></div></div>

 const upd=()=>{const t=T();$('.boot-t',el).textContent=t.toFixed(1).replace('.',',')+' с';const bar=$('.boot .bar span',el);bar.style.width=Math.min(100,t/30*100)+'%';bar.style.background=t<=GOAL?'var(--ok)':'linear-gradient(90deg,var(--org),var(--bad))'};
 upd();
 el.addEventListener('click',e=>{const t=e.target.closest('.tog');if(!t||locked)return;const k=t.dataset.k;on[k]=!on[k];t.setAttribute('aria-pressed',on[k]);t.textContent=on[k]?'Увімкнено':'Вимкнено';const x=P.find(p=>p.k===k);t.setAttribute('aria-label',`${x.n}: ${on[k]?'увімкнено':'вимкнено'}. Натисни, щоб змінити`);upd();live(`Час завантаження ${T().toFixed(1)} секунди`)});
 $('[data-check]',el).onclick=e=>{locked=true;e.target.disabled=true;$$('.tog',el).forEach(x=>x.disabled=true);
  const C=[{ok:on.av,l:'Антивірус залишився в автозавантаженні',w:'Антивірус має стартувати разом із системою, щоб захищати її в реальному часі.'},{ok:on.snd,l:'Драйвер звуку залишився увімкненим',w:'Без аудіоменеджера звук може працювати неправильно, а впливає він мало.'},{ok:!on.game&&!on.tor,l:'Ігровий лаунчер і торент-клієнт вимкнено',w:'Ці програми мають високий вплив і не потрібні одразу після вмикання — запустиш їх, коли знадобляться.'},{ok:T()<=GOAL,l:`Запуск триває не довше ${GOAL} с`,w:'Вимкни ще кілька програм із високим чи середнім впливом, які не потрібні щохвилини.'}];

 <svg viewBox="0 0 460 380" role="img" aria-label="Плата з процесором-щитом і потоками даних"><g class="bits">${[30,80,390,430].map((x,k)=>`<text x="${x}" y="${40+k*20}" style="animation-delay:${-k*1.3}s">${['0101','1100','0011','1010'][k]}<tspan x="${x}" dy="22">1001</tspan><tspan x="${x}" dy="22">0110</tspan><tspan x="${x}" dy="22">1110</tspan><tspan x="${x}" dy="22">0001</tspan></text>`).join('')}</g>
 <rect x="70" y="40" width="320" height="300" rx="26" fill="#2a1f63"/><g stroke="#c9a646" stroke-width="3" fill="none" opacity=".85"><path d="M110 80h60v40M350 90h-50v50M110 300h70v-50M350 300h-60v-40M230 40v60M230 340v-60M70 190h60M390 190h-60"/></g><g fill="#c9a646"><circle cx="110" cy="80" r="6"/><circle cx="350" cy="90" r="6"/><circle cx="110" cy="300" r="6"/><circle cx="350" cy="300" r="6"/></g>
 <rect x="96" y="250" width="60" height="16" rx="4" fill="#4a3aa8"/><rect x="96" y="272" width="60" height="16" rx="4" fill="#4a3aa8"/><rect x="304" y="120" width="56" height="12" rx="3" fill="#ff7a1a"/><rect x="304" y="138" width="56" height="12" rx="3" fill="#ff7a1a"/>
 <g class="pulse"><rect x="160" y="120" width="140" height="140" rx="20" fill="#5b3df5" stroke="#fff" stroke-width="4"/><path d="M230 150 196 163v24c0 21 14 38 34 45 20-7 34-24 34-45v-24z" fill="#fff"/><path d="m215 190 11 11 20-22" stroke="#5b3df5" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
 <g fill="#fff">${[0,1,2,3,4].map(k=>`<rect x="${172+k*24}" y="106" width="8" height="14" rx="2"/><rect x="${172+k*24}" y="260" width="8" height="14" rx="2"/>`).join('')}</g></svg></div>
 <div class="wrap"><h2 style="font-size:24px;margin-bottom:12px">Як рахуються бали</h2><div class="rules"><div class="rule"><b>Бали за першу спробу</b><p>У кожному розділі — тести, сортування, пари, симулятори. Зараховується перша перевірка, а потренуватися можна скільки завгодно.</p></div><div class="rule"><b>Оцінка за 11-бальною шкалою</b><p>Підсумок — середній відсоток усіх восьми розділів. 90% і більше — 11 балів.</p></div><div class="rule"><b>12 балів — за бонус</b><p>Непросте завдання з кодування даних: двійковий код, ASCII, стиснення RLE, обсяг інформації.</p></div></div>
 <h2 style="font-size:24px;margin:8px 0 12px">Карта лабораторії</h2><div class="map">${SECS.map(s=>`<a class="tile" href="#${s.id}" style="--ac:${s.ac};text-decoration:none;color:inherit"><i>${ico(s.icon)}</i><span><small>Тема ${s.n}</small>${s.short}</span></a>`).join('')}<a class="tile" href="#bonus" style="--ac:#3b2a99;text-decoration:none;color:inherit"><i>${ico('code')}</i><span><small>Бонус</small>Злам коду</span></a></div></div><nav class="pn"></nav></section>`);
 const f=$('form',v),inp=$('#nm',v);inp.value=S.name||'';f.addEventListener('submit',e=>{e.preventDefault();S.name=inp.value.trim();save();location.hash='t1'});
 return v;
}
function resultsView(){return h(`<section class="view" id="v-results" hidden tabindex="-1"><div class="rbody"></div><nav class="pn"></nav></section>`)}
function drawResults(){
 const v=$('#v-results .rbody');const mp=mainPct(),g=gradeOf(mp),fg=finalGrade(),bs=S.t.bonus?.d?S.t.bonus.s:0;const allDone=SECS.every(s=>secStat(s.id).full);
 v.innerHTML=`<div class="grade"><div class="gnum${fg===12?' twelve':''}" aria-label="Оцінка ${fg}">${fg}</div><div><div class="snum">Підсумок${S.name?' · '+esc(S.name):''}</div><h2>${fg===12?'Абсолютний максимум!':fg>=10?'Чудовий результат!':fg>=7?'Добрий результат':fg>=4?'Є над чим попрацювати':'Почни з теорії й карток'}</h2><p>Середній результат за вісім розділів: <b>${mp.toFixed(1).replace('.',',')}%</b> → ${g} ${g===1?'бал':g<5?'бали':'балів'} за 11-бальною шкалою.${fg===12?' Бонус розв’язано повністю — оцінку підвищено до 12!':g===11?(bs===BONUS_MAX?'':` Щоб отримати 12, розв’яжи всі задачі бонусу (зараз ${bs} з ${BONUS_MAX}).`):''}</p>${allDone?'':'<p><b>Увага:</b> не всі завдання виконано. Невиконані рахуються як 0 — повернися до розділу, щоб покращити оцінку.</p>'}</div></div>
 <div class="wrap"><table class="rtable"><thead><tr><th>Розділ</th><th class="hide">Виконано</th><th>Бали</th><th class="hide">Результат</th><th>%</th></tr></thead><tbody>${SECS.map(s=>{const st=secStat(s.id);return`<tr><td><a href="#${s.id}">Тема ${s.n}. ${s.short}</a></td><td class="hide">${st.d} / ${st.n}</td><td class="n">${st.s} / ${st.m}</td><td class="hide"><div class="bar"><span style="width:${st.pct}%"></span></div></td><td class="n">${Math.round(st.pct)}%</td></tr>`}).join('')}<tr><td><a href="#bonus">Бонус: кодування даних</a></td><td class="hide">${S.t.bonus?.d?'1 / 1':'0 / 1'}</td><td class="n">${bs} / ${BONUS_MAX}</td><td class="hide"><div class="bar"><span style="width:${bs/BONUS_MAX*100}%"></span></div></td><td class="n">${Math.round(bs/BONUS_MAX*100)}%</td></tr></tbody></table>
 <h3 style="margin:24px 0 10px">Шкала оцінювання</h3><div class="scale">${GR.map(([t,gg])=>`<span class="${gg===g&&fg!==12?'me':''}">${gg} — від ${t}%</span>`).join('')}<span class="${fg===12?'me':''}">12 — 11 + бонус 5/5</span></div>
 <div class="act" style="margin-top:22px"><a class="btn pri" href="#t1">Переглянути розділи</a><button class="btn ghost" type="button" id="resetAll">Почати все спочатку</button></div></div>`;
 $('#resetAll').onclick=()=>{const m=h(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div><h3 id="mt">Почати спочатку?</h3><p>Усі бали й прогрес буде видалено.</p><div class="act"><button class="btn org" type="button" data-y>Так, скинути</button><button class="btn ghost" type="button" data-n>Скасувати</button></div></div></div>`);document.body.append(m);m.querySelector('[data-n]').focus();
  m.addEventListener('click',e=>{if(e.target.closest('[data-y]')){S={name:S.name,t:{},seen:{}};save();location.hash='start';location.reload()}if(e.target.closest('[data-n]')||e.target===m)m.remove()});m.addEventListener('keydown',e=>{if(e.key==='Escape')m.remove()})};
 if(fg>=11)confetti();
}

/* ================= BUILD & ROUTER ================= */
const app=$('#app');
app.append(startView());SECS.forEach((s,i)=>app.append(sectionView(s,i)));app.append(bonusView());app.append(resultsView());
$$('.view').forEach(v=>{const id=v.id.slice(2);const pn=$('.pn',v);if(pn)pn.innerHTML=navFor(id)});
$('#sideList').innerHTML=ORDER.map((id,k)=>{const s=SECS.find(x=>x.id===id);const n=s?s.n:id==='start'?'⌂':id==='bonus'?'★':'∑';return`<li><a href="#${id}" data-id="${id}" data-n="${n}"><span class="st">${n}</span><span class="nm">${NAMES[id]}</span>${SEC_TASKS[id]?'<small></small>':'<span></span>'}</a></li>`}).join('');
function route(){let id=location.hash.slice(1);if(!ORDER.includes(id))id='start';
 $$('.view').forEach(v=>{v.hidden=v.id!=='v-'+id});const v=$('#v-'+id);
 v.style.animation='none';void v.offsetWidth;v.style.animation='';
 $$('#sideList a').forEach(a=>{if(a.dataset.id===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 $('#sideList a[aria-current]')?.scrollIntoView({block:'nearest',inline:'center'});
 if(id==='results')drawResults();
 S.seen[id]=1;save();scrollTo(0,0);v.focus({preventScroll:true});document.title=`${NAMES[id]} — КіберЛаб 8`}
addEventListener('hashchange',route);
refresh();route();

/* ================= CONFETTI ================= */
function confetti(){if(RM)return;const c=$('#cf'),x=c.getContext('2d');c.hidden=false;c.width=innerWidth;c.height=innerHeight;const cols=['#5b3df5','#ff7a1a','#0fa3a0','#e0457b','#ffd23f'];
 const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:6+Math.random()*6,c:cols[Math.random()*5|0],r:Math.random()*6}));let t=0;
 const f=()=>{x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<110)requestAnimationFrame(f);else c.hidden=true};f()}
}
</script>
